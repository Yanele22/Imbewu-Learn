  :root{
    --ink:#182B21;
    --ink-soft:#2A4034;
    --paper:#EEF1EC;
    --paper-raised:#F8F9F6;
    --line:rgba(24,43,33,0.14);
    --line-strong:rgba(24,43,33,0.28);
    --brass:#A6793D;
    --brass-soft:#D8BE8C;
    --wine:#7A2E2E;
    --wine-soft:#F1DCDA;
    --sage:#4B6C53;
    --sage-soft:#DCE7DE;
    --slate:#5B6B62;
    --white:#fff;
    --radius:3px;
    --shadow:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Newsreader', serif;
    font-weight:500;
    margin:0;
    letter-spacing:-0.01em;
  }
  .num{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--brass-soft);}

  /* ---------- SHELL ---------- */
  #shell{display:flex; min-height:100vh;}
  #sidebar{
    width:236px; flex:none; background:var(--ink); color:var(--paper-raised);
    display:flex; flex-direction:column; padding:28px 0 18px;
    position:sticky; top:0; height:100vh;
  }
  .brand{padding:0 22px 22px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:14px;}
  .brand .mark{font-family:'Newsreader', serif; font-size:20px; font-weight:500; line-height:1.15; color:var(--white);}
  .brand .sub{font-size:10.5px; color:var(--brass-soft); margin-top:6px; letter-spacing:.02em;}
  .brand .reg{font-size:9.5px; color:rgba(255,255,255,0.4); margin-top:10px; line-height:1.5;}

  nav.tabs{display:flex; flex-direction:column; gap:1px; padding:6px 10px;}
  nav.tabs button{
    all:unset; display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:2px; color:rgba(255,255,255,0.68);
    font-size:13px; cursor:pointer; position:relative;
  }
  nav.tabs button svg{flex:none; opacity:0.85;}
  nav.tabs button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  nav.tabs button.active{background:rgba(166,121,61,0.18); color:#fff;}
  nav.tabs button.active::before{
    content:''; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; background:var(--brass);
  }
  .tab-count{
    margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    background:rgba(255,255,255,0.12); padding:1px 6px; border-radius:8px;
  }

  .side-foot{margin-top:auto; padding:16px 22px 0; border-top:1px solid rgba(255,255,255,0.12);}
  .role-switch{display:flex; gap:0; margin-bottom:12px; border:1px solid rgba(255,255,255,0.2); border-radius:3px; overflow:hidden;}
  .role-switch button{all:unset; flex:1; text-align:center; padding:7px 4px; font-size:11.5px; color:rgba(255,255,255,0.55); cursor:pointer;}
  .role-switch button.active{background:var(--brass); color:#1B2318; font-weight:600;}
  .client-select{width:100%; background:rgba(255,255,255,0.07); color:#fff; border:1px solid rgba(255,255,255,0.18);
    border-radius:3px; padding:7px 8px; font-size:12px; font-family:inherit;}
  .client-select option{color:#111;}

  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    padding:20px 36px; border-bottom:1px solid var(--line); display:flex; align-items:baseline;
    justify-content:space-between; background:var(--paper-raised);
  }
  #topbar .title{font-size:24px;}
  #topbar .meta{font-size:12px; color:var(--slate);}
  #content{padding:30px 36px 60px; max-width:1180px;}

  /* ---------- PRIMITIVES ---------- */
  .panel{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px;
  }
  .panel + .panel{margin-top:16px;}
  .grid{display:grid; gap:16px;}
  .grid-2{grid-template-columns:1.3fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .eyebrow-off{ } /* deliberately no all-caps eyebrows per style guidance */
  .label{font-size:11.5px; color:var(--slate);}
  .hr{height:1px; background:var(--line); border:0; margin:16px 0;}

  .stat-row{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .stat{}
  .stat .v{font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:500; letter-spacing:-0.01em;}
  .stat .l{font-size:12px; color:var(--slate); margin-top:2px;}
  .stat.up .v{color:var(--sage);}
  .stat.down .v{color:var(--wine);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{ text-align:left; font-weight:500; color:var(--slate); font-size:11.5px; padding:8px 10px; border-bottom:1px solid var(--line-strong);}
  td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:0;}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}

  .pill{display:inline-block; padding:2.5px 9px; border-radius:20px; font-size:11px; font-weight:500;}
  .pill.active{background:var(--sage-soft); color:var(--sage);}
  .pill.due{background:var(--wine-soft); color:var(--wine);}
  .pill.pending{background:#EDE6D6; color:var(--brass);}
  .pill.both{background:#E4E8F0; color:#40506B;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--ink); background:var(--ink);
    color:#fff; padding:9px 16px; border-radius:3px; font-size:13px; font-weight:500;
  }
  .btn:hover{background:var(--ink-soft);}
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn.secondary:hover{border-color:var(--ink);}
  .btn.small{padding:6px 11px; font-size:12px;}
  .btn.wine{background:var(--wine); border-color:var(--wine);}

  .card-btn{
    text-align:left; border:1px solid var(--line); background:var(--paper-raised); border-radius:var(--radius);
    padding:16px 16px; display:flex; flex-direction:column; gap:6px; width:100%;
  }
  .card-btn:hover{border-color:var(--brass); background:#FBF8F2;}
  .card-btn .t{font-family:'Newsreader',serif; font-size:16px;}
  .card-btn .d{font-size:12px; color:var(--slate);}

  /* progress bars */
  .goal{padding:16px 0; border-bottom:1px solid var(--line);}
  .goal:last-child{border-bottom:0;}
  .goal-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:12px; flex-wrap:wrap;}
  .goal-name{font-family:'Newsreader',serif; font-size:16.5px;}
  .goal-tag{font-size:10.5px; padding:2px 7px; border-radius:20px; border:1px solid var(--line-strong); color:var(--slate); margin-left:8px;}
  .goal-amounts{font-size:12.5px; color:var(--slate); font-family:'IBM Plex Mono',monospace;}
  .bar-track{height:8px; background:#E2E6DE; border-radius:20px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--brass); border-radius:20px;}
  .goal-foot{display:flex; justify-content:space-between; margin-top:6px; font-size:11.5px; color:var(--slate);}

  /* claims pipeline */
  .pipeline{display:flex; flex-direction:column;}
  .pstep{display:flex; gap:14px; padding:11px 0; position:relative;}
  .pstep .dot-col{display:flex; flex-direction:column; align-items:center; width:18px; flex:none;}
  .pstep .dot{width:11px; height:11px; border-radius:50%; background:var(--line-strong); border:2px solid var(--paper-raised); z-index:1;}
  .pstep.done .dot{background:var(--sage);}
  .pstep.current .dot{background:var(--brass); box-shadow:0 0 0 4px rgba(166,121,61,0.22);}
  .pstep .stem{flex:1; width:1.5px; background:var(--line-strong); margin-top:2px;}
  .pstep.done .stem{background:var(--sage);}
  .pstep:last-child .stem{display:none;}
  .pstep .body{flex:1; padding-bottom:2px;}
  .pstep .st{font-size:13.5px; font-weight:500;}
  .pstep.done .st{color:var(--slate);}
  .pstep.current .st{color:var(--ink);}
  .pstep .sd{font-size:12px; color:var(--slate); margin-top:2px;}

  /* checklist */
  .check-item{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .check-item:last-child{border-bottom:0;}
  .check-item input{margin-top:3px; width:15px; height:15px; accent-color:var(--brass);}
  .check-item label{font-size:13.5px;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(20,28,22,0.5); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:48px 20px; overflow:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper-raised); width:100%; max-width:640px; border-radius:4px; border:1px solid var(--line-strong);}
  .modal-head{padding:18px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-size:19px;}
  .modal-close{all:unset; cursor:pointer; font-size:20px; color:var(--slate); padding:4px 8px;}
  .modal-body{padding:20px 24px 24px; max-height:70vh; overflow:auto;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--slate); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line-strong); border-radius:3px; padding:9px 10px; font-size:13.5px; font-family:inherit;
    background:#fff; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .badge-dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;}
  .provider-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .provider{border:1px solid var(--line); border-radius:3px; padding:12px 13px; display:flex; flex-direction:column; gap:5px;}
  .provider .pname{font-weight:600; font-size:13.5px;}
  .provider .pstatus{font-size:11.5px; color:var(--slate); display:flex; align-items:center;}

  .toast{position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:12px 18px; border-radius:4px;
    font-size:13px; z-index:80; opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s; pointer-events:none;}
  .toast.show{opacity:1; transform:translateY(0);}

  .step-wizard-nav{display:flex; gap:6px; margin-bottom:18px;}
  .swn-item{flex:1; height:3px; background:var(--line-strong); border-radius:2px;}
  .swn-item.active{background:var(--brass);}

  .empty-hint{font-size:12.5px; color:var(--slate); font-style:italic; padding:10px 0;}

  @media (max-width:880px){
    #sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s;}
    #sidebar.open{transform:translateX(0);}
    .grid-2, .grid-3, .provider-grid, .field-row{grid-template-columns:1fr;}
    #content{padding:22px 18px 60px;}
    #topbar{padding:16px 18px;}
  }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card-btn:focus-visible{
    outline:2px solid var(--brass); outline-offset:1px;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>

/* =========================================================
   HELPERS
   ========================================================= */
function fmtR(n){
  return 'R ' + Math.round(n).toLocaleString('en-ZA');
}
function fmtDate(d){
  if(d==='—') return d;
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-ZA', {day:'numeric', month:'short', year:'numeric'});
}
function daysUntil(d){
  const dt = new Date(d+'T00:00:00');
  const now = new Date('2026-09-05T00:00:00');
  return Math.round((dt-now)/86400000);
}
function currentClient(){ return clients.find(c=>c.id===state.clientId); }
function clientsForView(){ return state.role==='client' ? clients.filter(c=>c.id===state.clientId) : clients; }
function netWorth(c){
  const a = c.assets.reduce((s,x)=>s+x.value,0);
  const l = c.liabilities.reduce((s,x)=>s+x.value,0);
  return {a,l,net:a-l};
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); document.getElementById('modal').innerHTML=''; }
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('overlay').classList.add('open'); }

   RENDER: SHELL
   ========================================================= */
function renderShell(){
  document.getElementById('roleSwitch').querySelectorAll('button').forEach(b=>{
    b.classList.toggle('active', b.dataset.role===state.role);
    b.onclick = ()=>{ state.role=b.dataset.role; if(state.role==='client'){} renderAll(); };
  });

  const sel = document.getElementById('clientSelect');
  if(state.role==='adviser'){
    sel.style.display='';
    sel.innerHTML = clients.map(c=>`<option value="${c.id}" ${c.id===state.clientId?'selected':''}>${c.name}</option>`).join('');
    sel.onchange = ()=>{ state.clientId = sel.value; renderAll(); };
  } else {
    sel.style.display='none';
  }

  const nav = document.getElementById('navTabs');
  const tabs = tabsByRole[state.role];
  if(!tabs.find(t=>t[0]===state.tab)) state.tab = 'dashboard';
  nav.innerHTML = tabs.map(([key,label,icon])=>{
    let count = '';
    if(key==='reminders'){
      const n = reminderRules.filter(r=> state.role==='adviser' ? true : r.clientId===state.clientId).filter(r=>daysUntil(r.due)<=30).length;
      if(n>0) count = `<span class="tab-count">${n}</span>`;
    }
    if(key==='claims'){
      const n = claims.filter(c=> state.role==='adviser' ? c.status==='in_progress' : (c.clientId===state.clientId && c.status==='in_progress')).length;
      if(n>0) count = `<span class="tab-count">${n}</span>`;
    }
    return `<button data-tab="${key}" class="${key===state.tab?'active':''}">${icon}<span>${label}</span>${count}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ state.tab=b.dataset.tab; renderAll(); };
  });
}

function renderRequests(){
  document.getElementById('pageTitle').textContent = 'Requests';
  document.getElementById('pageMeta').textContent = 'Everything else that used to be a form.';
  document.getElementById('topbarRight').innerHTML = '';

  let html = `<div class="panel">
    <h3 style="font-size:15px; margin-bottom:12px;">Start a request</h3>
    <div class="grid grid-3">
      ${requestTypes.map(rt=>`<button class="card-btn" data-key="${rt.key}" data-label="${rt.label}">
        <span class="t">${rt.label}</span>
        <span class="d">${rt.desc}</span>
      </button>`).join('')}
    </div>
  </div>`;

  const list = requests.filter(r=> state.role==='adviser' ? true : r.clientId===state.clientId);
  const statusPill = {complete:'active', sent:'both', in_progress:'pending'};
  const statusLabel = {complete:'Complete', sent:'Sent to provider', in_progress:'In progress'};
  html += `<div class="panel" style="margin-top:16px;">
    <h3 style="font-size:15px; margin-bottom:10px;">Recent requests</h3>
    <table>
      <thead><tr><th>Type</th>${state.role==='adviser'?'<th>Client</th>':''}<th>Provider</th><th>Date</th><th>Status</th></tr></thead>
      <tbody>
        ${list.slice().reverse().map(r=>{
          const c = clients.find(x=>x.id===r.clientId);
          return `<tr>
            <td>${r.type}</td>
            ${state.role==='adviser'?`<td>${c.name}</td>`:''}
            <td class="label">${r.provider}</td>
            <td class="label">${fmtDate(r.date)}</td>
            <td><span class="pill ${statusPill[r.status]}">${statusLabel[r.status]}</span></td>
          </tr>`;
        }).join('') || `<tr><td colspan="5" class="empty-hint">No requests yet.</td></tr>`}
      </tbody>
    </table>
  </div>`;

  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('[data-key]').forEach(btn=>{
    btn.onclick = ()=> openRequestModal(btn.dataset.key, btn.dataset.label);
  });
}

function openRequestModal(key, label){
  const clientOpts = clients.map(c=>`<option value="${c.id}" ${c.id===state.clientId?'selected':''}>${c.name}</option>`).join('');
  let fields = '';
  if(key==='address'){
    fields = `<div class="field"><label>New residential address</label><textarea name="detail" required></textarea></div>
    <div class="field"><label>Effective date</label><input name="date2" type="date"></div>`;
  } else if(key==='bank'){
    fields = `<div class="field-row">
      <div class="field"><label>Bank</label><input name="bank" required></div>
      <div class="field"><label>Account number</label><input name="acc" required></div>
    </div>
    <div class="field"><label>Which policies should this apply to?</label><input name="detail" placeholder="e.g. All / specific policy"></div>`;
  } else if(key==='policydoc' || key==='irp5' || key==='border'){
    fields = `<div class="field"><label>Provider</label><input name="provider" required placeholder="e.g. Sanlam"></div>
    <div class="field"><label>Notes</label><textarea name="detail" placeholder="Policy number, tax year, or travel dates if relevant"></textarea></div>`;
  } else if(key==='consult'){
    fields = `<div class="field-row">
      <div class="field"><label>Preferred date</label><input name="date2" type="date" required></div>
      <div class="field"><label>Preferred time</label><input name="time2" type="time"></div>
    </div>
    <div class="field"><label>What would you like to discuss?</label><textarea name="detail"></textarea></div>`;
  } else if(key==='infocollect'){
    fields = `<div class="field"><label>Upload balance sheet</label><input type="file"></div>
    <div class="field"><label>Upload income statement</label><input type="file"></div>
    <div class="field"><label>Notes for your adviser</label><textarea name="detail"></textarea></div>`;
  }

  openModal(`
    <div class="modal-head"><h3>${label}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <form id="reqForm">
        ${state.role==='adviser'?`<div class="field"><label>Client</label><select name="client">${clientOpts}</select></div>`:''}
        ${fields}
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitRequest('${key}','${label}')">Submit request</button>
    </div>
  `);
}
function submitRequest(key,label){
  const f = document.getElementById('reqForm');
  if(!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f).entries());
  requests.push({
    id:'RQ-'+Math.floor(3300+Math.random()*90),
    clientId: d.client || state.clientId,
    type: label,
    provider: d.provider || d.bank || '—',
    status: 'in_progress',
    date: '2026-09-05',
  });
  closeModal();
  toast('Request sent — we\u2019ll route it straight to the provider where possible');
  state.tab='requests'; renderAll();
}

/* =========================================================
   RENDER: INTEGRATIONS
   ========================================================= */
function renderIntegrations(){
  document.getElementById('pageTitle').textContent = 'Integrations';
  document.getElementById('pageMeta').textContent = 'The more that passes straight through automatically, the more useful the app becomes.';
  document.getElementById('topbarRight').innerHTML = '';

  const dotColor = {api:'var(--sage)', file:'var(--brass)', manual:'var(--slate)'};
  const html = `<div class="panel">
    <div class="provider-grid">
      ${providers.map(p=>`<div class="provider">
        <div class="pname">${p.name}</div>
        <div class="pstatus"><span class="badge-dot" style="background:${dotColor[p.level]}"></span>${p.status}</div>
      </div>`).join('')}
    </div>
  </div>
  <div class="panel" style="margin-top:16px;">
    <h3 style="font-size:15px; margin-bottom:6px;">Legend</h3>
    <div style="display:flex; gap:22px; flex-wrap:wrap; font-size:12.5px;">
      <div><span class="badge-dot" style="background:var(--sage)"></span>API connected — real-time, straight-through</div>
      <div><span class="badge-dot" style="background:var(--brass)"></span>File transfer — batched, automated</div>
      <div><span class="badge-dot" style="background:var(--slate)"></span>Manual — staff-handled today</div>
    </div>
  </div>`;
  document.getElementById('content').innerHTML = html;
}

/* =========================================================
   MASTER RENDER
   ========================================================= */
function renderAll(){
  renderShell();
  const map = {dashboard:renderDashboard, goals:renderGoals, reminders:renderReminders, claims:renderClaims, requests:renderRequests, integrations:renderIntegrations};
  (map[state.tab]||renderDashboard)();
}
renderAll();
</script>
</body>
</html>
